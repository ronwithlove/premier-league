<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      --background: #0b1120;
      --card: #111827;
      --border: #1f2937;
      --foreground: #f8fafc;
      --muted-foreground: #94a3b8;
      --primary: #38bdf8;
      --primary-foreground: #082f49;
    }
    html.light {
      --background: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --foreground: #0f172a;
      --muted-foreground: #64748b;
      --primary: #0284c7;
      --primary-foreground: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--background);
      color: var(--foreground);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      margin: 0;
      padding: 0;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    .chart-scroll::-webkit-scrollbar {
      height: 8px;
      width: 8px;
    }
    .chart-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .chart-scroll::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 999px;
    }
    .team-path {
      transition: opacity 0.22s ease, stroke-width 0.22s ease, filter 0.22s ease;
    }
    .team-node {
      transition: opacity 0.22s ease, transform 0.18s ease;
      cursor: pointer;
    }
    .team-node:hover {
      filter: brightness(1.1);
    }
    .pill-btn {
      transition: all 0.15s ease;
      cursor: pointer;
    }
    .pill-btn:hover {
      transform: translateY(-1px);
    }
    #tooltip {
      pointer-events: none;
      transition: opacity 0.12s ease, transform 0.12s ease;
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased min-h-screen">
  <div class="max-w-[1440px] mx-auto px-4 sm:px-6 py-5 space-y-4">
    <!-- Header -->

        <div class="flex items-center gap-2.5 mb-1">

        </p>
      </div>

          <div id="kpi-titles-val" class="text-sm sm:text-base font-bold mt-0.5 flex items-center gap-1.5"></div>
        </div>

        </div>
        <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl px-3.5 py-2.5">
          <div id="kpi-ever-label" class="text-xs text-[var(--muted-foreground)]">14 季全勤球队</div>
          <div id="ever-present-count" class="text-sm sm:text-base font-bold mt-0.5 font-mono">—</div>
        </div>
      </div>
    </div>

    <!-- Controls Bar -->
    <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-3 sm:p-4 space-y-3">

        <!-- Preset Modes -->
        <div class="flex flex-wrap items-center gap-1.5" id="mode-buttons">
          <button data-mode="featured" class="pill-btn px-3 py-1.5 rounded-lg text-xs font-medium border">
            ✨ 视觉聚焦（Big 6 + 奇迹冠军）
          </button>
          <button data-mode="all" class="pill-btn px-3 py-1.5 rounded-lg text-xs font-medium border">
            🌈 全部 20 队全彩
          </button>
          <button data-mode="big6" class="pill-btn px-3 py-1.5 rounded-lg text-xs font-medium border">
            ⚔️ 仅看 Big 6
          </button>
          <button data-mode="champions" class="pill-btn px-3 py-1.5 rounded-lg text-xs font-medium border">
            🏆 历届冠军队 (6 队)
          </button>
          <button data-mode="darkhorses" class="pill-btn px-3 py-1.5 rounded-lg text-xs font-medium border">

          </button>
        </div>

    // =========================================================================
    // Main SVG Bump Chart Renderer
    // =========================================================================
    function renderChart() {
      const svg = document.getElementById('bump-chart');
      const seasons = getVisibleSeasons();
      const numSeasons = seasons.length;
      const numRanks = 20;

      const padLeft = 58;
      const padRight = 152;
      const padTop = 44;
      const padBottom = 34;

      const colStep = numSeasons >= 12 ? 84 : numSeasons >= 8 ? 102 : 136;
      const rowStep = 31;

      const width = padLeft + (numSeasons - 1) * colStep + padRight;
      const height = padTop + (numRanks - 1) * rowStep + padBottom;

      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
      svg.setAttribute('width', width);
      svg.setAttribute('height', height);
      svg.innerHTML = '';

      const ns = 'http://www.w3.org/2000/svg';
      const el = (tag, attrs = {}, parent = null) => {
        const node = document.createElementNS(ns, tag);
        Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
        if (parent) parent.appendChild(node);
        return node;
      };

      const xOf = (sIdx) => padLeft + sIdx * colStep;
      const yOf = (rank) => padTop + (rank - 1) * rowStep;

      const light = isLightTheme();
      const fg = getCssVar('--foreground', light ? '#0f172a' : '#f8fafc');
      const muted = getCssVar('--muted-foreground', light ? '#64748b' : '#94a3b8');
      const border = getCssVar('--border', light ? '#e2e8f0' : '#334155');
      const cardBg = getCssVar('--card', light ? '#ffffff' : '#111827');

      // Defs for glow
      const defs = el('defs', {}, svg);
      const glow = el('filter', { id: 'gold-glow', x: '-30%', y: '-30%', width: '160%', height: '160%' }, defs);
      el('feGaussianBlur', { stdDeviation: '2.5', result: 'blur' }, glow);
      const merge = el('feMerge', {}, glow);
      el('feMergeNode', { in: 'blur' }, merge);
      el('feMergeNode', { in: 'SourceGraphic' }, merge);

      // 1. Background Zone Bands
      const zonesLayer = el('g', { class: 'zones-layer' }, svg);

      // Rank 1 Champion Gold Band
      el('rect', {
        x: 6, y: yOf(1) - rowStep / 2,
        width: width - 12, height: rowStep,
        rx: 8,
        fill: light ? 'rgba(245, 158, 11, 0.11)' : 'rgba(245, 158, 11, 0.14)'
      }, zonesLayer);

      // Rank 2-4 UCL Band
      el('rect', {
        x: 6, y: yOf(2) - rowStep / 2,
        width: width - 12, height: rowStep * 3,
        rx: 6,
        fill: light ? 'rgba(16, 185, 129, 0.06)' : 'rgba(16, 185, 129, 0.08)'
      }, zonesLayer);

      // Rank 5-6 Europa Band
      el('rect', {
        x: 6, y: yOf(5) - rowStep / 2,
        width: width - 12, height: rowStep * 2,
        rx: 6,
        fill: light ? 'rgba(59, 130, 246, 0.05)' : 'rgba(59, 130, 246, 0.07)'
      }, zonesLayer);

      // Rank 18-20 Relegation Band
      el('rect', {
        x: 6, y: yOf(18) - rowStep / 2,
        width: width - 12, height: rowStep * 3,
        rx: 8,
        fill: light ? 'rgba(239, 68, 68, 0.07)' : 'rgba(239, 68, 68, 0.10)'
      }, zonesLayer);

      // Left accent bars for zones
      el('rect', { x: 8, y: yOf(1) - rowStep / 2 + 2, width: 3.5, height: rowStep - 4, rx: 2, fill: '#F59E0B' }, zonesLayer);
      el('rect', { x: 8, y: yOf(2) - rowStep / 2 + 2, width: 3.5, height: rowStep * 3 - 4, rx: 2, fill: '#10B981' }, zonesLayer);
      el('rect', { x: 8, y: yOf(5) - rowStep / 2 + 2, width: 3.5, height: rowStep * 2 - 4, rx: 2, fill: '#3B82F6' }, zonesLayer);
      el('rect', { x: 8, y: yOf(18) - rowStep / 2 + 2, width: 3.5, height: rowStep * 3 - 4, rx: 2, fill: '#EF4444' }, zonesLayer);

      // Dashed divider lines (Top 4 & Relegation)
      el('line', {
        x1: padLeft - 24, x2: width - padRight + 24,
        y1: yOf(4) + rowStep / 2, y2: yOf(4) + rowStep / 2,
        stroke: '#10B981', 'stroke-opacity': 0.35, 'stroke-dasharray': '4 4', 'stroke-width': 1
      }, zonesLayer);

      el('line', {
        x1: padLeft - 24, x2: width - padRight + 24,
        y1: yOf(17) + rowStep / 2, y2: yOf(17) + rowStep / 2,
        stroke: '#EF4444', 'stroke-opacity': 0.45, 'stroke-dasharray': '4 4', 'stroke-width': 1
      }, zonesLayer);

      // 2. Grid lines & Axis Labels
      const gridLayer = el('g', { class: 'grid-layer' }, svg);

      for (let r = 1; r <= numRanks; r++) {
        const y = yOf(r);
        el('line', {
          x1: padLeft, x2: xOf(numSeasons - 1),
          y1: y, y2: y,
          stroke: border, 'stroke-opacity': 0.3, 'stroke-width': 0.75
        }, gridLayer);

        const rankColor = r === 1 ? '#F59E0B' : r <= 4 ? '#10B981' : r >= 18 ? '#EF4444' : muted;
        const txt = el('text', {
          x: 24, y: y + 4,
          fill: rankColor,
          'font-size': r === 1 ? '12' : '11',
          'font-weight': r === 1 || r <= 4 || r >= 18 ? '700' : '500',
          'font-family': 'ui-monospace, SFMono-Regular, Menlo, monospace'
        }, gridLayer);
        txt.textContent = r === 1 ? '1🏆' : String(r);
      }

      seasons.forEach((s, idx) => {
        const x = xOf(idx);
        el('line', {
          x1: x, x2: x,
          y1: padTop - 16, y2: yOf(numRanks) + 14,
          stroke: border, 'stroke-opacity': 0.45, 'stroke-width': 1
        }, gridLayer);

        const topLabel = el('text', {
          x, y: 20,
          'text-anchor': 'middle',
          fill: idx === numSeasons - 1 ? fg : muted,
          'font-size': '12',
          'font-weight': idx === numSeasons - 1 ? '700' : '600',
          'font-family': 'ui-monospace, SFMono-Regular, Menlo, monospace'
        }, gridLayer);
        topLabel.textContent = s.label;

        const botLabel = el('text', {
          x, y: height - 8,
          'text-anchor': 'middle',
          fill: muted,
          'font-size': '11',
          'font-family': 'ui-monospace, SFMono-Regular, Menlo, monospace'
        }, gridLayer);
        botLabel.textContent = s.id;
      });

      // 3. Collect paths per team within visible seasons
      const teamPoints = {};
      seasons.forEach((s, sIdx) => {
        s.table.forEach(([code, pts], idx) => {
          if (!teamPoints[code]) teamPoints[code] = [];
          teamPoints[code].push({ sIdx, season: s.label, id: s.id, rank: idx + 1, pts });
        });
      });

      // 4. Draw Paths
      const pathsLayer = el('g', { class: 'paths-layer' }, svg);
      const nodesLayer = el('g', { class: 'nodes-layer' }, svg);
      const rightLabelsLayer = el('g', { class: 'right-labels-layer' }, svg);

      Object.entries(teamPoints).forEach(([code, ptsList]) => {
        const club = CLUBS[code];
        const gTeam = el('g', { 'data-team': code, class: 'team-path-group' }, pathsLayer);

        for (let i = 0; i < ptsList.length - 1; i++) {
          const a = ptsList[i];
          const b = ptsList[i + 1];
          const x1 = xOf(a.sIdx), y1 = yOf(a.rank);
          const x2 = xOf(b.sIdx), y2 = yOf(b.rank);
          const consecutive = (b.sIdx - a.sIdx) === 1;

          const dx = (x2 - x1) * 0.48;
          const d = `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;

          el('path', {
            d,
            fill: 'none',
            stroke: club.color,
            'stroke-linecap': 'round',
            'stroke-dasharray': consecutive ? 'none' : '4 5',
            'data-consecutive': consecutive ? '1' : '0',
            'data-team': code,
            class: 'team-path'
          }, gTeam);
        }
      });

      // 5. Draw Nodes
      seasons.forEach((s, sIdx) => {
        const x = xOf(sIdx);
        s.table.forEach(([code, pts], idx) => {
          const rank = idx + 1;
          const y = yOf(rank);
          const club = CLUBS[code];

          const gNode = el('g', {
            class: 'team-node',
            'data-team': code,
            'data-sidx': sIdx,
            'data-rank': rank,
            'data-pts': pts
          }, nodesLayer);

          const isChamp = rank === 1;
          const pillW = labelLang === 'zh' ? 44 : 38;
          const pillH = isChamp ? 22 : 19;

          el('rect', {
            x: x - pillW / 2,
            y: y - pillH / 2,
            width: pillW,
            height: pillH,
            rx: isChamp ? 11 : 9.5,
            fill: club.color,
            stroke: isChamp ? '#F59E0B' : cardBg,
            'stroke-width': isChamp ? 2.2 : 1.5,
            filter: isChamp ? 'url(#gold-glow)' : 'none',
            class: 'node-rect'
          }, gNode);

          const txt = el('text', {
            x,
            y: y + 3.5,
            'text-anchor': 'middle',
            fill: '#ffffff',
            'font-size': labelLang === 'zh' ? '10' : '9.5',
            'font-weight': '700',
            'letter-spacing': labelLang === 'zh' ? '0' : '0.03em',
            'font-family': labelLang === 'zh' ? 'system-ui, -apple-system, sans-serif' : 'ui-monospace, SFMono-Regular, Menlo, monospace',
            class: 'node-text'
          }, gNode);
          txt.textContent = labelLang === 'zh' ? club.shortZh : code;

          gNode.addEventListener('mouseenter', (ev) => {
            hoveredTeam = code;
            updateHighlights();
            showTooltip(ev, code, sIdx, seasons);
          });
          gNode.addEventListener('mousemove', (ev) => moveTooltip(ev));
          gNode.addEventListener('mouseleave', () => {
            hoveredTeam = null;
            updateHighlights();
            hideTooltip();
          });
          gNode.addEventListener('click', () => togglePin(code));
        });
      });

      // 6. Right-side 2025-26 Final Season Club Names + Logo + Points
      const lastSeason = seasons[numSeasons - 1];
      const rightX = xOf(numSeasons - 1) + 28;
      lastSeason.table.forEach(([code, pts], idx) => {
        const rank = idx + 1;
        const y = yOf(rank);
        const gLabel = el('g', {
          class: 'team-node right-label',
          'data-team': code
        }, rightLabelsLayer);

        const lbl = el('text', {
          x: rightX,
          y: y + 4,
          fill: fg,
          'font-size': '11.5',
          'font-weight': rank <= 4 ? '700' : '500'
        }, gLabel);
        lbl.textContent = getClubDisplayName(code, true);

        const textWidth = lbl.getComputedTextLength();
        const logoX = rightX + textWidth + 5;
        const logoSize = 15;
        const img = el('image', {
          x: logoX,
          y: y - logoSize / 2,
          width: logoSize,
          height: logoSize,
          href: getClubLogoUrl(code),
          preserveAspectRatio: 'xMidYMid meet'
        }, gLabel);
        img.addEventListener('error', () => {
          img.setAttribute('href', getClubFallbackSvg(code));
        }, { once: true });

        const ptsLbl = el('text', {
          x: logoX + logoSize + 4,
          y: y + 4,
          fill: muted,
          'font-size': '11',
          'font-family': 'ui-monospace, SFMono-Regular, Menlo, monospace',
          'font-weight': rank <= 4 ? '700' : '500'
        }, gLabel);
        ptsLbl.textContent = `· ${pts}`;

        gLabel.addEventListener('mouseenter', (ev) => {
          hoveredTeam = code;
          updateHighlights();
          showTooltip(ev, code, numSeasons - 1, seasons);
        });
        gLabel.addEventListener('mousemove', (ev) => moveTooltip(ev));
        gLabel.addEventListener('mouseleave', () => {
          hoveredTeam = null;
          updateHighlights();
          hideTooltip();
        });
        gLabel.addEventListener('click', () => togglePin(code));
      });

      updateHighlights();
    }

    function updateHighlights() {
      const tr = t();
      const light = isLightTheme();
      const neutralFill = light ? '#cbd5e1' : '#334155';
      const neutralText = light ? '#334155' : '#cbd5e1';
      const mutedStroke = light ? '#94a3b8' : '#475569';

      const anyFocus = Boolean(hoveredTeam) || pinnedTeams.size > 0;
      const svg = document.getElementById('bump-chart');

      svg.querySelectorAll('.team-path').forEach(path => {
        const code = path.dataset.team;
        const consecutive = path.dataset.consecutive === '1';
        const club = CLUBS[code];
        const emph = isTeamEmphasized(code);

        if (emph) {
          path.setAttribute('stroke', club.color);
          path.setAttribute('stroke-width', (hoveredTeam === code || pinnedTeams.has(code)) ? (consecutive ? 3.8 : 2.2) : (consecutive ? 2.8 : 1.5));
          path.setAttribute('stroke-opacity', consecutive ? (anyFocus ? 0.96 : 0.85) : 0.55);
          if (path.parentNode && path.parentNode.parentNode) {
            path.parentNode.parentNode.appendChild(path.parentNode);
          }
        } else {
          path.setAttribute('stroke', mutedStroke);
          path.setAttribute('stroke-width', consecutive ? 1.2 : 0.9);
          path.setAttribute('stroke-opacity', anyFocus ? 0.08 : 0.16);
        }
      });

      svg.querySelectorAll('.team-node:not(.right-label)').forEach(g => {
        const code = g.dataset.team;
        const club = CLUBS[code];
        const emph = isTeamEmphasized(code);
        const rect = g.querySelector('.node-rect');
        const text = g.querySelector('.node-text');

        if (emph) {
          g.style.opacity = '1';
          rect.setAttribute('fill', club.color);
          text.setAttribute('fill', '#ffffff');
        } else if (anyFocus) {
          g.style.opacity = '0.22';
          rect.setAttribute('fill', neutralFill);
          text.setAttribute('fill', neutralText);
        } else {
          g.style.opacity = '0.72';
          rect.setAttribute('fill', neutralFill);
          text.setAttribute('fill', neutralText);
        }
      });

      svg.querySelectorAll('.right-label').forEach(g => {
        const code = g.dataset.team;
        const emph = isTeamEmphasized(code);
        g.style.opacity = emph ? '1' : (anyFocus ? '0.22' : '0.68');
      });

      const statusEl = document.getElementById('active-status');
      if (hoveredTeam) {
        statusEl.textContent = tr.statusHover(CLUBS[hoveredTeam]);
      } else if (pinnedTeams.size > 0) {
        statusEl.textContent = tr.statusPinned([...pinnedTeams].map(c => getClubDisplayName(c, true)).join(' · '));
      } else {
        statusEl.textContent = tr.modeStatus[currentMode];
      }
    }

    // =========================================================================
    // Tooltip
    // =========================================================================
    function showTooltip(ev, code, sIdx, seasons) {
      const tr = t();
      const tip = document.getElementById('tooltip');
      const club = CLUBS[code];
      const s = seasons[sIdx];
      const entryIdx = s.table.findIndex(([c]) => c === code);
      if (entryIdx === -1) return;

      const rank = entryIdx + 1;
      const pts = s.table[entryIdx][1];
      const h = clubHistory[code];

      const fullIdx = SEASONS.findIndex(x => x.id === s.id);
      let deltaHtml = `<span class="text-[var(--muted-foreground)]">${tr.tipBaseline}</span>`;
      if (fullIdx > 0) {
        const prevSeason = SEASONS[fullIdx - 1];
        const prevPos = prevSeason.table.findIndex(([c]) => c === code);
        if (prevPos === -1) {
          deltaHtml = `<span style="color:#10B981;font-weight:600">${tr.tipPromoted}</span>`;
        } else {
          const diff = (prevPos + 1) - rank;
          if (diff > 0) deltaHtml = `<span style="color:#10B981;font-weight:600">${tr.tipUp(diff)}</span>`;
          else if (diff < 0) deltaHtml = `<span style="color:#EF4444;font-weight:600">${tr.tipDown(Math.abs(diff))}</span>`;
          else deltaHtml = `<span class="text-[var(--muted-foreground)]">${tr.tipSame}</span>`;
        }
      }

      const badge = rank === 1
        ? `<span class="px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-500 font-bold">${tr.badgeChamp}</span>`
        : rank <= 4
          ? `<span class="px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-500 font-semibold">${tr.badgeUcl}</span>`
          : rank >= 18
            ? `<span class="px-1.5 py-0.5 rounded bg-red-500/20 text-red-500 font-semibold">${tr.badgeRel}</span>`
            : '';

      const primaryName = uiLang === 'zh' ? club.zh : club.name;
      const secondaryName = uiLang === 'zh' ? club.name : club.zh;

      tip.innerHTML = `
        <div class="flex items-center justify-between gap-3 mb-2">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full shrink-0" style="background:${club.color}"></span>
            <div>
              <div class="font-bold text-sm text-[var(--foreground)] leading-tight flex items-center gap-1.5">
                <span>${primaryName}</span>
                ${clubLogoImg(code, 'w-4 h-4')}
              </div>
              <div class="text-[11px] text-[var(--muted-foreground)]">${secondaryName}</div>
            </div>
          </div>
          ${badge}
        </div>
        <div class="grid grid-cols-3 gap-1.5 py-2 border-y border-[var(--border)] text-center">
          <div>
            <div class="text-[10px] text-[var(--muted-foreground)]">${tr.tipSeason}</div>
            <div class="font-mono font-bold">${s.label}</div>
          </div>
          <div>
            <div class="text-[10px] text-[var(--muted-foreground)]">${tr.tipRank}</div>
            <div class="font-mono font-bold text-sm">#${rank}</div>
          </div>
          <div>
            <div class="text-[10px] text-[var(--muted-foreground)]">${tr.tipPts}</div>
            <div class="font-mono font-bold text-sm">${pts}</div>
          </div>
        </div>
        <div class="flex items-center justify-between mt-2 text-[11px]">
          <span>${tr.tipYoY} ${deltaHtml}</span>
          <span class="text-[var(--muted-foreground)]">${tr.tipAvg(h.avgRank.toFixed(1))}</span>
        </div>
        <div class="mt-1.5 text-[10px] text-[var(--muted-foreground)]">
          ${pinnedTeams.has(code) ? tr.tipClickUnpin : tr.tipClickPin}
        </div>
      `;

      tip.classList.remove('hidden');
      moveTooltip(ev);
    }

    function moveTooltip(ev) {
      const tip = document.getElementById('tooltip');
      const pad = 16;
      const tw = tip.offsetWidth || 230;
      const th = tip.offsetHeight || 140;
      let left = ev.clientX + pad;
      let top = ev.clientY + pad;
      if (left + tw > window.innerWidth - 10) left = ev.clientX - tw - pad;
      if (top + th > window.innerHeight - 10) top = ev.clientY - th - pad;
      tip.style.left = `${Math.max(8, left)}px`;
      tip.style.top = `${Math.max(8, top)}px`;
    }

    function hideTooltip() {
      document.getElementById('tooltip').classList.add('hidden');
    }

    // =========================================================================
    // Event Wiring
    // =========================================================================
    document.querySelectorAll('#mode-buttons button').forEach(btn => {
      btn.addEventListener('click', () => {
        currentMode = btn.dataset.mode;
        pinnedTeams.clear();
        updateControlButtons();
        renderClubChips();
        renderPinnedCards();
        updateHighlights();
      });
    });

    document.querySelectorAll('.range-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentRange = btn.dataset.range;
        updateControlButtons();
        renderChart();
      });
    });

    document.getElementById('toggle-ui-lang').addEventListener('click', () => {
      uiLang = uiLang === 'zh' ? 'en' : 'zh';
      localStorage.setItem('pl_ui_lang', uiLang);
      if (uiLang === 'en') labelLang = 'en';
      applyStaticTranslations();
      updateControlButtons();
      renderClubChips();
      renderChampionsTimeline();
      renderPinnedCards();
      renderChart();
    });

    document.getElementById('toggle-lang').addEventListener('click', () => {
      labelLang = labelLang === 'en' ? 'zh' : 'en';
      updateControlButtons();
      renderChart();
    });

    document.getElementById('toggle-theme').addEventListener('click', () => {
      document.documentElement.classList.toggle('light');
      updateControlButtons();
      renderClubChips();
      renderChart();
    });

    document.getElementById('clear-pins').addEventListener('click', () => {
      pinnedTeams.clear();
      renderClubChips();
      renderPinnedCards();
      updateHighlights();
    });

    // Initial render
    applyStaticTranslations();
    updateControlButtons();
    renderClubChips();
    renderChampionsTimeline();
    renderChart();
  </script>
</body>
</html>
