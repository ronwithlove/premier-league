<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>英超历年排名与深度分析全景图 (2012–13 至 2026–27)</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      --background: #0b1120;
      --card: #111827;
      --border: #1f2937;
      --foreground: #f8fafc;
      --muted-foreground: #94a3b8;
      --primary: #38bdf8;
      --primary-foreground: #082f49;
    }
    html.light {
      --background: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --foreground: #0f172a;
      --muted-foreground: #64748b;
      --primary: #0284c7;
      --primary-foreground: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--background);
      color: var(--foreground);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      margin: 0;
      padding: 0;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    .chart-scroll::-webkit-scrollbar {
      height: 8px;
      width: 8px;
    }
    .chart-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .chart-scroll::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 999px;
    }
    .team-path {
      transition: opacity 0.22s ease, stroke-width 0.22s ease;
    }
    .team-node {
      transition: opacity 0.22s ease, transform 0.18s ease;
      cursor: pointer;
    }
    .team-node:hover {
      filter: brightness(1.12);
    }
    .milestone-group {
      transition: opacity 0.22s ease;
      cursor: pointer;
    }
    .pill-btn {
      transition: all 0.15s ease;
      cursor: pointer;
    }
    .pill-btn:hover {
      transform: translateY(-1px);
    }
    #tooltip {
      pointer-events: none;
      transition: opacity 0.12s ease, transform 0.12s ease;
      backdrop-filter: blur(12px);
    }
    @keyframes livePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .live-dot {
      animation: livePulse 1.8s ease-in-out infinite;
    }
    th.sortable {
      cursor: pointer;
      user-select: none;
    }
    th.sortable:hover {
      color: var(--foreground);
    }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased min-h-screen">
  <div class="max-w-[1520px] mx-auto px-4 sm:px-6 py-5 space-y-4">
    <!-- Top Header Row with Top-Right Language & Theme Switcher -->
    <div class="flex flex-col gap-3">
      <div class="flex flex-wrap items-start justify-between gap-3">
        <div>
          <div class="flex flex-wrap items-center gap-2 mb-1">
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-[var(--primary)] text-[var(--primary-foreground)] tracking-wide">
              PREMIER LEAGUE
            </span>
            <span id="header-badge-sub" class="text-xs text-[var(--muted-foreground)] font-mono"></span>
            <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 live-dot"></span>
              <span id="live-asof-badge"></span>
            </span>
          </div>
          <h1 id="page-title" class="text-2xl sm:text-3xl font-bold tracking-tight text-[var(--foreground)]"></h1>
          <p id="page-subtitle" class="text-xs sm:text-sm text-[var(--muted-foreground)] mt-1"></p>
        </div>

        <!-- Top-Right Global Controls: 中文 | English + Theme -->
        <div class="flex items-center gap-2 shrink-0 self-start">
          <div class="inline-flex items-center rounded-xl border border-[var(--border)] bg-[var(--card)] p-0.5 text-xs shadow-sm" role="group" aria-label="Language switch">
            <button data-uilang="zh" class="uilang-btn px-3 py-1.5 rounded-lg font-semibold cursor-pointer transition-colors">中文</button>
            <button data-uilang="en" class="uilang-btn px-3 py-1.5 rounded-lg font-semibold cursor-pointer transition-colors">English</button>
          </div>
          <button id="toggle-theme" class="pill-btn px-3 py-1.5 rounded-xl text-xs font-medium border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] shadow-sm"></button>
        </div>
      </div>

      <!-- Quick KPI Cards -->
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-2.5">
        <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl px-3.5 py-2.5">
          <div id="kpi-1-lbl" class="text-xs text-[var(--muted-foreground)]"></div>
          <div id="kpi-1-val" class="text-sm sm:text-base font-bold mt-0.5 flex items-center gap-1.5"></div>
        </div>
        <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl px-3.5 py-2.5">
          <div id="kpi-2-lbl" class="text-xs text-[var(--muted-foreground)]"></div>
          <div id="kpi-2-val" class="text-sm sm:text-base font-bold mt-0.5 flex items-center gap-1.5"></div>
        </div>
        <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl px-3.5 py-2.5">
          <div id="kpi-3-lbl" class="text-xs text-[var(--muted-foreground)]"></div>
          <div id="kpi-3-val" class="text-sm sm:text-base font-bold mt-0.5 flex items-center gap-1.5"></div>
        </div>
        <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl px-3.5 py-2.5">
          <div id="kpi-4-lbl" class="text-xs text-[var(--muted-foreground)]"></div>
          <div id="ever-present-count" class="text-sm sm:text-base font-bold mt-0.5 font-mono">—</div>
        </div>
      </div>
    </div>

    <!-- Controls Bar -->
    <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-3 sm:p-4 space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <!-- View Switcher + Preset Modes -->
        <div class="flex flex-wrap items-center gap-2">
          <div class="inline-flex rounded-xl border border-[var(--border)] bg-[var(--background)] p-0.5 text-xs">
            <button data-view="rank" class="view-btn px-3 py-1.5 rounded-lg font-semibold cursor-pointer"></button>
            <button data-view="points" class="view-btn px-3 py-1.5 rounded-lg font-semibold cursor-pointer"></button>
          </div>

          <div class="h-5 w-px bg-[var(--border)] hidden sm:block"></div>

          <div class="flex flex-wrap items-center gap-1.5" id="mode-buttons">
            <button data-mode="featured" class="pill-btn px-2.5 py-1.5 rounded-lg text-xs font-medium border"></button>
            <button data-mode="all" class="pill-btn px-2.5 py-1.5 rounded-lg text-xs font-medium border"></button>
            <button data-mode="big6" class="pill-btn px-2.5 py-1.5 rounded-lg text-xs font-medium border"></button>
            <button data-mode="champions" class="pill-btn px-2.5 py-1.5 rounded-lg text-xs font-medium border"></button>
            <button data-mode="darkhorses" class="pill-btn px-2.5 py-1.5 rounded-lg text-xs font-medium border"></button>
          </div>
        </div>

        <!-- Right Controls -->
        <div class="flex flex-wrap items-center gap-2">
          <div class="inline-flex rounded-lg border border-[var(--border)] bg-[var(--background)] p-0.5 text-xs">
            <button data-range="all" class="range-btn px-2.5 py-1 rounded-md font-medium cursor-pointer"></button>
            <button data-range="10" class="range-btn px-2.5 py-1 rounded-md font-medium cursor-pointer"></button>
            <button data-range="6" class="range-btn px-2.5 py-1 rounded-md font-medium cursor-pointer"></button>
          </div>
          <button id="toggle-milestones" class="pill-btn px-2.5 py-1.5 rounded-lg text-xs font-medium border"></button>
          <button id="toggle-live" class="pill-btn inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-medium border"></button>
          <button id="toggle-lang" class="pill-btn px-2.5 py-1.5 rounded-lg text-xs font-medium border border-[var(--border)] bg-[var(--background)] text-[var(--foreground)]"></button>
          <button id="clear-pins" class="hidden pill-btn px-2.5 py-1.5 rounded-lg text-xs font-medium border border-[var(--border)] bg-[var(--background)] text-[var(--muted-foreground)] hover:text-[var(--foreground)]"></button>
        </div>
      </div>

      <!-- Multi-row Wrapping Quick Club Selector (fits screen width, no horizontal scroll) -->
      <div class="pt-2.5 border-t border-[var(--border)] space-y-2">
        <div class="flex items-center justify-between gap-2">
          <span id="pin-label" class="text-xs text-[var(--muted-foreground)] font-medium"></span>
          <span id="h2h-active-pill" class="hidden inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-amber-500/15 text-amber-400 border border-amber-500/35"></span>
        </div>
        <div id="club-chips" class="flex flex-wrap items-center gap-1.5 w-full"></div>
      </div>
    </div>

    <!-- Main Chart Card -->
    <div id="chart-card" class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-3 sm:p-4 relative space-y-3">
      <!-- Legend strip -->
      <div class="flex flex-wrap items-center justify-between gap-2 px-1 text-xs text-[var(--muted-foreground)]">
        <div id="legend-items" class="flex flex-wrap items-center gap-4"></div>
        <div id="active-status" class="text-xs font-medium text-[var(--foreground)]"></div>
      </div>

      <!-- SVG Container -->
      <div class="w-full overflow-x-auto chart-scroll">
        <svg id="bump-chart" class="block select-none" role="img" aria-label="Premier League Standings Chart"></svg>
      </div>
    </div>

    <!-- Pinned Team Cards & Champions Timeline -->
    <div id="team-summary-bar" class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-4">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
        <div>
          <h2 id="champ-title" class="text-sm font-semibold text-[var(--foreground)]"></h2>
          <p id="champ-sub" class="text-xs text-[var(--muted-foreground)] mt-0.5"></p>
        </div>
        <div id="champions-timeline" class="flex flex-wrap gap-1.5"></div>
      </div>
      <div id="pinned-cards" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 mt-3 pt-3 border-t border-[var(--border)]"></div>
    </div>

    <!-- ===================================================================== -->
    <!-- STAGE 2: Deep Analytics & Comparison Suite                            -->
    <!-- ===================================================================== -->
    <div id="analytics-suite" class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-4 sm:p-5 space-y-4">
      <!-- Section Header + Tabs -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-[var(--border)]">
        <div>
          <h2 id="analytics-title" class="text-base sm:text-lg font-bold text-[var(--foreground)]"></h2>
          <p id="analytics-sub" class="text-xs text-[var(--muted-foreground)] mt-0.5"></p>
        </div>
        <div class="inline-flex rounded-xl border border-[var(--border)] bg-[var(--background)] p-1 text-xs self-start">
          <button data-tab="h2h" class="tab-btn px-3 py-1.5 rounded-lg font-semibold cursor-pointer"></button>
          <button data-tab="alltime" class="tab-btn px-3 py-1.5 rounded-lg font-semibold cursor-pointer"></button>
          <button data-tab="movers" class="tab-btn px-3 py-1.5 rounded-lg font-semibold cursor-pointer"></button>
        </div>
      </div>

      <!-- TAB 1: Head-to-Head Rivalry PK -->
      <div id="tab-h2h" class="space-y-4">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div class="flex flex-wrap items-center gap-2">
            <select id="h2h-team-a" class="rounded-lg border border-[var(--border)] bg-[var(--background)] text-[var(--foreground)] px-3 py-1.5 text-xs font-semibold"></select>
            <span class="text-xs font-black text-[var(--muted-foreground)] px-1">VS</span>
            <select id="h2h-team-b" class="rounded-lg border border-[var(--border)] bg-[var(--background)] text-[var(--foreground)] px-3 py-1.5 text-xs font-semibold"></select>
            <button id="h2h-focus-btn" class="pill-btn px-3 py-1.5 rounded-lg text-xs font-semibold border"></button>
          </div>
          <div id="h2h-presets" class="flex flex-wrap items-center gap-1.5"></div>
        </div>
        <div id="h2h-dashboard"></div>
      </div>

      <!-- TAB 2: 14-Season All-Time Table -->
      <div id="tab-alltime" class="hidden space-y-3">
        <div id="alltime-hint" class="text-xs text-[var(--muted-foreground)]"></div>
        <div class="w-full overflow-x-auto chart-scroll rounded-xl border border-[var(--border)]">
          <table class="w-full text-xs text-left border-collapse">
            <thead id="alltime-thead" class="bg-[var(--background)] text-[var(--muted-foreground)] border-b border-[var(--border)]"></thead>
            <tbody id="alltime-tbody" class="divide-y divide-[var(--border)]"></tbody>
          </table>
        </div>
      </div>

      <!-- TAB 3: Biggest Movers Radar (Risers & Fallers) -->
      <div id="tab-movers" class="hidden grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div class="rounded-xl border border-[var(--border)] bg-[var(--background)] p-3.5 space-y-2.5">
          <div class="flex items-center justify-between">
            <h3 id="risers-title" class="text-sm font-bold text-emerald-400"></h3>
            <span id="risers-sub" class="text-[11px] text-[var(--muted-foreground)]"></span>
          </div>
          <div id="risers-list" class="space-y-2"></div>
        </div>
        <div class="rounded-xl border border-[var(--border)] bg-[var(--background)] p-3.5 space-y-2.5">
          <div class="flex items-center justify-between">
            <h3 id="fallers-title" class="text-sm font-bold text-rose-400"></h3>
            <span id="fallers-sub" class="text-[11px] text-[var(--muted-foreground)]"></span>
          </div>
          <div id="fallers-list" class="space-y-2"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Floating Tooltip -->
  <div id="tooltip" class="fixed z-50 hidden min-w-[250px] max-w-[300px] rounded-xl border border-[var(--border)] bg-[var(--card)]/95 shadow-2xl p-3 text-xs"></div>

    const COMPLETED_SEASONS = SEASONS.filter(s => !s.live);

    // Precompute Club Histories & All-Time Aggregates (Completed Seasons)
    const clubHistory = {};
    Object.keys(CLUBS).forEach(code => {
      clubHistory[code] = {
        code, seasons: [], liveSeason: null,
        best: 99, worst: 0, titles: 0, top4: 0, relegations: 0,
        totalPts: 0, totalMP: 0, totalW: 0, totalD: 0, totalL: 0, totalGF: 0, totalGA: 0, totalGD: 0,
        avgRank: 0, ppg: 0
      };
    });

    SEASONS.forEach((s, sIdx) => {
      s.table.forEach((row, idx) => {
        const [code, pts, mp, w, d, l, gf, ga, gd, form] = row;
        const rank = idx + 1;
        const h = clubHistory[code];
        const entry = { sIdx, season: s.label, id: s.id, rank, pts, mp, w, d, l, gf, ga, gd, form, live: Boolean(s.live) };
        if (s.live) {
          h.liveSeason = entry;
        } else {
          h.seasons.push(entry);
          if (rank < h.best) h.best = rank;
          if (rank > h.worst) h.worst = rank;
          if (rank === 1) h.titles++;
          if (rank <= 4) h.top4++;
          if (rank >= 18) h.relegations++;
          h.totalPts += pts; h.totalMP += mp; h.totalW += w; h.totalD += d; h.totalL += l;
          h.totalGF += (gf || 0); h.totalGA += (ga || 0); h.totalGD += gd;
        }
      });
    });

    Object.values(clubHistory).forEach(h => {
      if (h.seasons.length > 0) {
        h.avgRank = h.seasons.reduce((a, b) => a + b.rank, 0) / h.seasons.length;
        h.ppg = h.totalPts / h.totalMP;
      }
    });

    // Compute Biggest Single-Season Movers (Consecutive completed seasons)
    const ALL_MOVERS = [];
    for (let i = 1; i < COMPLETED_SEASONS.length; i++) {
      const prev = COMPLETED_SEASONS[i - 1];
      const curr = COMPLETED_SEASONS[i];
      curr.table.forEach((row, idx) => {
        const code = row[0];
        const prevIdx = prev.table.findIndex(r => r[0] === code);
        if (prevIdx !== -1) {
          const fromRank = prevIdx + 1;
          const toRank = idx + 1;
          const delta = fromRank - toRank; // positive = jumped up
          ALL_MOVERS.push({
            code, fromSeason: prev.id, toSeason: curr.id, toLabel: curr.label,
            fromRank, toRank, delta, fromPts: prev.table[prevIdx][1], toPts: row[1]
          });
        }
      });
    }
    const TOP_RISERS = [...ALL_MOVERS].sort((a, b) => b.delta - a.delta || a.toRank - b.toRank).slice(0, 6);
    const TOP_FALLERS = [...ALL_MOVERS].sort((a, b) => a.delta - b.delta || b.toRank - a.toRank).slice(0, 6);

    function t() { return I18N[uiLang]; }
    function clubLabel(code) { return uiLang === 'zh' ? CLUBS[code].zh : CLUBS[code].shortEn; }
    function clubShort(code) { return uiLang === 'zh' ? CLUBS[code].shortZh : CLUBS[code].shortEn; }
    function isLightTheme() { return document.documentElement.classList.contains('light'); }
    function getCssVar(name, fallback) {
      const val = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      return val || fallback;
    }
    function fmtGD(gd) { return gd > 0 ? `+${gd}` : `${gd}`; }

    function getVisibleSeasons() {
      const pool = (includeLive && currentView === 'rank') ? SEASONS : COMPLETED_SEASONS;
      if (currentRange === '10') return pool.slice(-10);
      if (currentRange === '6') return pool.slice(-6);
      return pool;
    }

    function isTeamEmphasized(code) {
      if (h2hChartActive) return code === h2hTeamA || code === h2hTeamB;
      if (hoveredTeam) return code === hoveredTeam || pinnedTeams.has(code);
      if (pinnedTeams.size > 0) return pinnedTeams.has(code);
      if (currentMode === 'all') return true;
      if (currentMode === 'big6') return BIG6.has(code);
      if (currentMode === 'champions') return CHAMPIONS.has(code);
      if (currentMode === 'darkhorses') return DARKHORSES.has(code);
      return FEATURED.has(code);
    }

    function renderFormDots(form) {
      if (!form) return '';
      return form.split('').map((ch, idx) => {
        const isLatest = idx === form.length - 1;
        const bg = ch === 'W' ? '#10B981' : ch === 'L' ? '#EF4444' : '#94A3B8';
        const sym = ch === 'W' ? '✓' : ch === 'L' ? '✕' : '–';
        const title = ch === 'W' ? (uiLang === 'zh' ? '胜' : 'Win') : ch === 'L' ? (uiLang === 'zh' ? '负' : 'Loss') : (uiLang === 'zh' ? '平' : 'Draw');
        const ring = isLatest ? `box-shadow:0 0 0 2px var(--card), 0 0 0 3.5px ${bg};` : '';
        return `<span title="${title}" style="background:${bg};${ring}" class="inline-flex items-center justify-center w-4 h-4 rounded-full text-[9px] font-bold text-white leading-none">${sym}</span>`;

    function renderClubChips() {
      const tr = t();
      const container = document.getElementById('club-chips');
      container.innerHTML = '';
      CHIP_ORDER.forEach(code => {
        const club = CLUBS[code];
        const isPinned = pinnedTeams.has(code);
        const btn = document.createElement('button');
        btn.className = `pill-btn inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium border`;
        if (isPinned) {
          btn.style.background = club.color;
          btn.style.borderColor = club.color;
          btn.style.color = '#ffffff';
        } else {
          btn.style.background = 'var(--background)';
          btn.style.borderColor = 'var(--border)';
          btn.style.color = 'var(--foreground)';
        }
        btn.innerHTML = `<span class="w-2 h-2 rounded-full" style="background:${isPinned ? '#fff' : club.color}"></span>${clubLabel(code)}`;
        btn.addEventListener('click', () => {
          h2hChartActive = false;
          togglePin(code);
        });
        btn.addEventListener('mouseenter', () => { hoveredTeam = code; updateHighlights(); });
        btn.addEventListener('mouseleave', () => { hoveredTeam = null; updateHighlights(); });
        container.appendChild(btn);
      });

      const clearBtn = document.getElementById('clear-pins');
      if (pinnedTeams.size > 0) {
        clearBtn.classList.remove('hidden');
        clearBtn.textContent = tr.clearPins(pinnedTeams.size);
      } else {
        clearBtn.classList.add('hidden');
      }

      const h2hPill = document.getElementById('h2h-active-pill');
      if (h2hChartActive) {
        h2hPill.classList.remove('hidden');
        h2hPill.textContent = tr.h2hActivePill(clubLabel(h2hTeamA), clubLabel(h2hTeamB));
      } else {
        h2hPill.classList.add('hidden');
      }
    }

          <span class="font-semibold">${clubShort(champCode)}</span>
        `;
        chip.addEventListener('click', () => { h2hChartActive = false; togglePin(champCode); });
        container.appendChild(chip);
      });
    }

    function renderPinnedCards() {

      const box = document.getElementById('pinned-cards');
      if (pinnedTeams.size === 0) {
        box.classList.add('hidden');
        box.innerHTML = '';
        return;
      }

      box.innerHTML = '';

      pinnedTeams.forEach(code => {
        const club = CLUBS[code];
        const h = clubHistory[code];
        const card = document.createElement('div');
        card.className = 'rounded-xl border border-[var(--border)] bg-[var(--background)] p-3 flex flex-col gap-2';

        const liveHtml = h.liveSeason ? `
          <div class="flex items-center justify-between gap-2 px-2.5 py-1.5 rounded-lg bg-emerald-500/10 border border-emerald-500/25 text-[11px]">
            <div class="flex items-center gap-1.5 flex-wrap">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 live-dot"></span>
              <span class="font-semibold text-emerald-400">26–27 #${h.liveSeason.rank}</span>
              <span class="font-mono text-[var(--foreground)]">${h.liveSeason.pts}${tr.ptsUnit} (${h.liveSeason.mp}MP · ${h.liveSeason.w}-${h.liveSeason.d}-${h.liveSeason.l} · GD ${fmtGD(h.liveSeason.gd)})</span>
            </div>
            ${h.liveSeason.form ? `<div class="flex items-center gap-1 shrink-0">${renderFormDots(h.liveSeason.form)}</div>` : ''}
          </div>
        ` : '';

        card.innerHTML = `
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span class="w-3 h-3 rounded-full" style="background:${club.color}"></span>
              <span class="font-bold text-sm">${clubLabel(code)}</span>
              <span class="text-xs text-[var(--muted-foreground)]">${uiLang === 'zh' ? club.name : club.zh}</span>
            </div>
            <button data-unpin="${code}" class="text-xs text-[var(--muted-foreground)] hover:text-[var(--foreground)] px-1.5 py-0.5 rounded cursor-pointer">✕</button>
          </div>
          <div class="grid grid-cols-4 gap-2 text-center">
            <div class="rounded-lg bg-[var(--card)] border border-[var(--border)] py-1.5">
              <div class="text-[11px] text-[var(--muted-foreground)]">${tr.cardTitles}</div>
              <div class="font-mono font-bold text-sm">${h.titles}</div>
            </div>
            <div class="rounded-lg bg-[var(--card)] border border-[var(--border)] py-1.5">
              <div class="text-[11px] text-[var(--muted-foreground)]">${tr.cardBest}</div>
              <div class="font-mono font-bold text-sm">${h.seasons.length ? '#' + h.best : (h.liveSeason ? '#' + h.liveSeason.rank : '—')}</div>
            </div>
            <div class="rounded-lg bg-[var(--card)] border border-[var(--border)] py-1.5">
              <div class="text-[11px] text-[var(--muted-foreground)]">${tr.cardAvg}</div>
              <div class="font-mono font-bold text-sm">${h.seasons.length ? h.avgRank.toFixed(1) : '—'}</div>
            </div>
            <div class="rounded-lg bg-[var(--card)] border border-[var(--border)] py-1.5">
              <div class="text-[11px] text-[var(--muted-foreground)]">${tr.cardSznRel}</div>
              <div class="font-mono font-bold text-sm">${h.seasons.length}/${h.relegations}</div>
            </div>
          </div>
          ${liveHtml}
          <div class="flex flex-wrap gap-1 pt-0.5">
            ${h.seasons.map(item => `
              <span title="${item.season}: #${item.rank} · ${item.pts} pts (${item.w}-${item.d}-${item.l}, GD ${fmtGD(item.gd)})"
                class="inline-flex items-center gap-0.5 px-1.5 py-0.5 rounded text-[11px] font-mono border border-[var(--border)]"
                style="${item.rank === 1 ? 'background:rgba(245,158,11,0.18);border-color:#F59E0B;font-weight:700;' : item.rank >= 18 ? 'background:rgba(239,68,68,0.14);border-color:rgba(239,68,68,0.5);' : ''}">
                <span class="text-[var(--muted-foreground)]">${item.id}:</span><span>#${item.rank}</span>
              </span>
            `).join('')}
          </div>
        `;
        card.querySelector('[data-unpin]').addEventListener('click', () => togglePin(code));
        box.appendChild(card);
      });
    }

    function togglePin(code) {
      if (pinnedTeams.has(code)) pinnedTeams.delete(code);
      else pinnedTeams.add(code);
      renderClubChips();
      renderPinnedCards();
      renderChart();
    }

    // =========================================================================
    // Main SVG Chart Renderer (Rank & Points + H2H Rivalry Ribbon Area Fill)
    // =========================================================================
    function renderChart() {
      const svg = document.getElementById('bump-chart');
      const seasons = getVisibleSeasons();
      const numSeasons = seasons.length;
      const numRanks = 20;
      const isPtsView = currentView === 'points';
      const tr = t();

      const padLeft = 60;
      const padRight = 132;
      const padTop = 58;
      const padBottom = 38;

      const colStep = numSeasons >= 13 ? 80 : numSeasons >= 9 ? 98 : 132;
      const rowStep = 31;
      const plotHeight = (numRanks - 1) * rowStep;

      const width = padLeft + (numSeasons - 1) * colStep + padRight;
      const height = padTop + plotHeight + padBottom;

      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
      svg.setAttribute('width', width);
      svg.setAttribute('height', height);
      svg.innerHTML = '';

      const ns = 'http://www.w3.org/2000/svg';
      const el = (tag, attrs = {}, parent = null) => {
        const node = document.createElementNS(ns, tag);
        Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
        if (parent) parent.appendChild(node);
        return node;
      };

      const xOf = (sIdx) => padLeft + sIdx * colStep;
      const yOfRank = (rank) => padTop + (rank - 1) * rowStep;
      const ptsMax = 104, ptsMin = 10;
      const yOfPts = (pts) => padTop + ((ptsMax - pts) / (ptsMax - ptsMin)) * plotHeight;
      const yOfEntry = (rank, pts) => isPtsView ? yOfPts(pts) : yOfRank(rank);

      const light = isLightTheme();
      const fg = getCssVar('--foreground', light ? '#0f172a' : '#f8fafc');
      const muted = getCssVar('--muted-foreground', light ? '#64748b' : '#94a3b8');
      const border = getCssVar('--border', light ? '#e2e8f0' : '#334155');
      const cardBg = getCssVar('--card', light ? '#ffffff' : '#111827');

      const defs = el('defs', {}, svg);
      const glow = el('filter', { id: 'gold-glow', x: '-30%', y: '-30%', width: '160%', height: '160%' }, defs);
      el('feGaussianBlur', { stdDeviation: '2.5', result: 'blur' }, glow);
      const merge = el('feMerge', {}, glow);
      el('feMergeNode', { in: 'blur' }, merge);
      el('feMergeNode', { in: 'SourceGraphic' }, merge);

      // 1. Background Zones
      const zonesLayer = el('g', { class: 'zones-layer' }, svg);
      if (!isPtsView) {
        el('rect', { x: 6, y: yOfRank(1) - rowStep / 2, width: width - 12, height: rowStep, rx: 8, fill: light ? 'rgba(245, 158, 11, 0.11)' : 'rgba(245, 158, 11, 0.14)' }, zonesLayer);
        el('rect', { x: 6, y: yOfRank(2) - rowStep / 2, width: width - 12, height: rowStep * 3, rx: 6, fill: light ? 'rgba(16, 185, 129, 0.06)' : 'rgba(16, 185, 129, 0.08)' }, zonesLayer);
        el('rect', { x: 6, y: yOfRank(5) - rowStep / 2, width: width - 12, height: rowStep * 2, rx: 6, fill: light ? 'rgba(59, 130, 246, 0.05)' : 'rgba(59, 130, 246, 0.07)' }, zonesLayer);
        el('rect', { x: 6, y: yOfRank(18) - rowStep / 2, width: width - 12, height: rowStep * 3, rx: 8, fill: light ? 'rgba(239, 68, 68, 0.07)' : 'rgba(239, 68, 68, 0.10)' }, zonesLayer);

        el('rect', { x: 8, y: yOfRank(1) - rowStep / 2 + 2, width: 3.5, height: rowStep - 4, rx: 2, fill: '#F59E0B' }, zonesLayer);
        el('rect', { x: 8, y: yOfRank(2) - rowStep / 2 + 2, width: 3.5, height: rowStep * 3 - 4, rx: 2, fill: '#10B981' }, zonesLayer);
        el('rect', { x: 8, y: yOfRank(5) - rowStep / 2 + 2, width: 3.5, height: rowStep * 2 - 4, rx: 2, fill: '#3B82F6' }, zonesLayer);
        el('rect', { x: 8, y: yOfRank(18) - rowStep / 2 + 2, width: 3.5, height: rowStep * 3 - 4, rx: 2, fill: '#EF4444' }, zonesLayer);

        el('line', { x1: padLeft - 24, x2: width - padRight + 24, y1: yOfRank(4) + rowStep / 2, y2: yOfRank(4) + rowStep / 2, stroke: '#10B981', 'stroke-opacity': 0.35, 'stroke-dasharray': '4 4', 'stroke-width': 1 }, zonesLayer);
        el('line', { x1: padLeft - 24, x2: width - padRight + 24, y1: yOfRank(17) + rowStep / 2, y2: yOfRank(17) + rowStep / 2, stroke: '#EF4444', 'stroke-opacity': 0.45, 'stroke-dasharray': '4 4', 'stroke-width': 1 }, zonesLayer);
      } else {
        el('rect', { x: 6, y: yOfPts(104), width: width - 12, height: yOfPts(90) - yOfPts(104), rx: 6, fill: light ? 'rgba(245, 158, 11, 0.08)' : 'rgba(245, 158, 11, 0.10)' }, zonesLayer);
        el('rect', { x: 6, y: yOfPts(90), width: width - 12, height: yOfPts(70) - yOfPts(90), rx: 4, fill: light ? 'rgba(16, 185, 129, 0.05)' : 'rgba(16, 185, 129, 0.06)' }, zonesLayer);
        el('rect', { x: 6, y: yOfPts(40), width: width - 12, height: yOfPts(10) - yOfPts(40), rx: 6, fill: light ? 'rgba(239, 68, 68, 0.06)' : 'rgba(239, 68, 68, 0.08)' }, zonesLayer);
      }

      const liveIdx = seasons.findIndex(s => s.live);
      if (liveIdx !== -1) {
        const lx = xOf(liveIdx);
        el('rect', {
          x: lx - 30, y: 4, width: 60, height: height - 8, rx: 12,
          fill: light ? 'rgba(16, 185, 129, 0.07)' : 'rgba(16, 185, 129, 0.08)',
          stroke: '#10B981', 'stroke-opacity': 0.35, 'stroke-dasharray': '4 3', 'stroke-width': 1
        }, zonesLayer);
      }

      // 2. Grid lines & Axis Labels
      const gridLayer = el('g', { class: 'grid-layer' }, svg);
      if (!isPtsView) {
        for (let r = 1; r <= numRanks; r++) {
          const y = yOfRank(r);
          el('line', { x1: padLeft, x2: xOf(numSeasons - 1), y1: y, y2: y, stroke: border, 'stroke-opacity': 0.3, 'stroke-width': 0.75 }, gridLayer);
          const rankColor = r === 1 ? '#F59E0B' : r <= 4 ? '#10B981' : r >= 18 ? '#EF4444' : muted;
          const txt = el('text', {
            x: 24, y: y + 4, fill: rankColor,
            'font-size': r === 1 ? '12' : '11',
            'font-weight': r === 1 || r <= 4 || r >= 18 ? '700' : '500',
            'font-family': 'ui-monospace, SFMono-Regular, Menlo, monospace'
          }, gridLayer);
          txt.textContent = r === 1 ? '1🏆' : String(r);
        }
      } else {
        [100, 90, 80, 70, 60, 50, 40, 30, 20, 10].forEach(pt => {
          const y = yOfPts(pt);
          const isKey = pt === 100 || pt === 90 || pt === 70 || pt === 40;
          const lineColor = pt === 90 || pt === 100 ? '#F59E0B' : pt === 70 ? '#10B981' : pt === 40 ? '#EF4444' : border;
          el('line', { x1: padLeft - 8, x2: xOf(numSeasons - 1) + 12, y1: y, y2: y, stroke: lineColor, 'stroke-opacity': isKey ? 0.45 : 0.28, 'stroke-dasharray': isKey ? '4 4' : 'none', 'stroke-width': isKey ? 1.1 : 0.75 }, gridLayer);
          const txt = el('text', { x: 48, y: y + 4, 'text-anchor': 'end', fill: isKey ? lineColor : muted, 'font-size': '11', 'font-weight': isKey ? '700' : '500', 'font-family': 'ui-monospace, SFMono-Regular, Menlo, monospace' }, gridLayer);
          txt.textContent = `${pt}${uiLang === 'zh' ? '分' : ''}`;
        });
      }

      seasons.forEach((s, idx) => {
        const x = xOf(idx);
        el('line', { x1: x, x2: x, y1: padTop - 16, y2: padTop + plotHeight + 14, stroke: s.live ? '#10B981' : border, 'stroke-opacity': s.live ? 0.35 : 0.42, 'stroke-dasharray': s.live ? '3 3' : 'none', 'stroke-width': 1 }, gridLayer);
        if (s.live) {
          el('rect', { x: x - 24, y: 6, width: 48, height: 15, rx: 7.5, fill: 'rgba(16, 185, 129, 0.2)', stroke: '#10B981', 'stroke-width': 0.8 }, gridLayer);
          const badgeTxt = el('text', { x, y: 16.5, 'text-anchor': 'middle', fill: '#10B981', 'font-size': '9', 'font-weight': '700' }, gridLayer);
          badgeTxt.textContent = 'LIVE';
        }
        const topLabel = el('text', { x, y: s.live ? 32 : 24, 'text-anchor': 'middle', fill: s.live ? '#10B981' : (idx === numSeasons - 1 ? fg : muted), 'font-size': '11.5', 'font-weight': (s.live || idx === numSeasons - 1) ? '700' : '600', 'font-family': 'ui-monospace, SFMono-Regular, Menlo, monospace' }, gridLayer);
        topLabel.textContent = s.label;

        const botLabel = el('text', { x, y: height - 10, 'text-anchor': 'middle', fill: s.live ? '#10B981' : muted, 'font-size': '10.5', 'font-weight': s.live ? '700' : '400', 'font-family': 'ui-monospace, SFMono-Regular, Menlo, monospace' }, gridLayer);
        botLabel.textContent = s.live ? tr.liveColBot : s.id;
      });

      // 3. H2H Ribbon Area Fill Layer (when h2hChartActive is ON)
      const ribbonLayer = el('g', { class: 'h2h-ribbon-layer' }, svg);
      if (h2hChartActive && h2hTeamA !== h2hTeamB) {
        const posBySeason = seasons.map((s, sIdx) => {
          const iA = s.table.findIndex(r => r[0] === h2hTeamA);
          const iB = s.table.findIndex(r => r[0] === h2hTeamB);
          return {
            x: xOf(sIdx),
            yA: iA !== -1 ? yOfEntry(iA + 1, s.table[iA][1]) : null,
            yB: iB !== -1 ? yOfEntry(iB + 1, s.table[iB][1]) : null
          };
        });

        for (let i = 0; i < posBySeason.length - 1; i++) {
          const p1 = posBySeason[i];
          const p2 = posBySeason[i + 1];
          if (p1.yA === null || p1.yB === null || p2.yA === null || p2.yB === null) continue;

          const d1 = p1.yA - p1.yB; // negative => A is higher on screen
          const d2 = p2.yA - p2.yB;
          const colA = CLUBS[h2hTeamA].color;
          const colB = CLUBS[h2hTeamB].color;

          if ((d1 <= 0 && d2 <= 0) || (d1 >= 0 && d2 >= 0)) {
            const winnerCol = (d1 + d2) <= 0 ? colA : colB;
            el('polygon', {
              points: `${p1.x},${p1.yA} ${p2.x},${p2.yA} ${p2.x},${p2.yB} ${p1.x},${p1.yB}`,
              fill: winnerCol, 'fill-opacity': light ? '0.20' : '0.22'
            }, ribbonLayer);
          } else {
            // Curves cross within this segment: split cleanly at exact intersection!
            const ratio = Math.abs(d1) / (Math.abs(d1) + Math.abs(d2));
            const ix = p1.x + (p2.x - p1.x) * ratio;
            const iy = p1.yA + (p2.yA - p1.yA) * ratio;
            el('polygon', {
              points: `${p1.x},${p1.yA} ${ix},${iy} ${p1.x},${p1.yB}`,
              fill: d1 < 0 ? colA : colB, 'fill-opacity': light ? '0.20' : '0.22'
            }, ribbonLayer);
            el('polygon', {
              points: `${ix},${iy} ${p2.x},${p2.yA} ${p2.x},${p2.yB}`,
              fill: d2 < 0 ? colA : colB, 'fill-opacity': light ? '0.20' : '0.22'
            }, ribbonLayer);
          }
        }
      }

      // 4. Collect points per team
      const teamPoints = {};
      seasons.forEach((s, sIdx) => {
        s.table.forEach((row, idx) => {
          const code = row[0];
          if (!teamPoints[code]) teamPoints[code] = [];
          teamPoints[code].push({ sIdx, season: s.label, id: s.id, rank: idx + 1, pts: row[1], live: Boolean(s.live) });
        });
      });

      const pathsLayer = el('g', { class: 'paths-layer' }, svg);
      const nodesLayer = el('g', { class: 'nodes-layer' }, svg);
      const milestonesLayer = el('g', { class: 'milestones-layer' }, svg);
      const rightLabelsLayer = el('g', { class: 'right-labels-layer' }, svg);

      // 5. Draw Paths
      Object.entries(teamPoints).forEach(([code, ptsList]) => {
        const club = CLUBS[code];
        const gTeam = el('g', { 'data-team': code, class: 'team-path-group' }, pathsLayer);

        for (let i = 0; i < ptsList.length - 1; i++) {
          const a = ptsList[i];
          const b = ptsList[i + 1];
          const x1 = xOf(a.sIdx), y1 = yOfEntry(a.rank, a.pts);
          const x2 = xOf(b.sIdx), y2 = yOfEntry(b.rank, b.pts);
          const consecutive = (b.sIdx - a.sIdx) === 1;
          const toLive = b.live;
          const isDashed = (!consecutive || toLive);

          // In H2H ribbon mode, straight segments align seamlessly with the ribbon fill!
          const dx = h2hChartActive ? 0 : (x2 - x1) * 0.48;
          const d = h2hChartActive
            ? `M ${x1} ${y1} L ${x2} ${y2}`
            : `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;

          el('path', {
            d, fill: 'none', stroke: club.color, 'stroke-linecap': 'round',
            'stroke-dasharray': isDashed ? '5 4' : 'none',
            'data-consecutive': (consecutive && !toLive) ? '1' : '0',
            'data-tolive': toLive ? '1' : '0',
            'data-team': code,
            class: 'team-path'
          }, gTeam);
        }
      });

      // 6. Draw Nodes
      seasons.forEach((s, sIdx) => {
        const x = xOf(sIdx);
        s.table.forEach((row, idx) => {
          const [code, pts] = row;
          const rank = idx + 1;
          const y = yOfEntry(rank, pts);
          const club = CLUBS[code];

          const gNode = el('g', { class: 'team-node', 'data-team': code, 'data-sidx': sIdx, 'data-rank': rank, 'data-pts': pts }, nodesLayer);
          const isChamp = rank === 1 && !s.live;
          const isLiveLeader = rank === 1 && s.live;
          const pillW = isPtsView ? (labelLang === 'zh' ? 40 : 34) : (labelLang === 'zh' ? 44 : 38);
          const pillH = isPtsView ? (isChamp ? 20 : 17) : ((isChamp || isLiveLeader) ? 22 : 19);

          el('rect', {
            x: x - pillW / 2, y: y - pillH / 2, width: pillW, height: pillH, rx: pillH / 2,
            fill: club.color,
            stroke: isChamp ? '#F59E0B' : (isLiveLeader ? '#10B981' : cardBg),
            'stroke-width': (isChamp || isLiveLeader) ? 2.2 : 1.4,
            filter: isChamp ? 'url(#gold-glow)' : 'none',
            class: 'node-rect'
          }, gNode);

          const txt = el('text', {
            x, y: y + 3.2, 'text-anchor': 'middle', fill: '#ffffff',
            'font-size': isPtsView ? '9' : (labelLang === 'zh' ? '10' : '9.5'),
            'font-weight': '700',
            'letter-spacing': labelLang === 'zh' ? '0' : '0.03em',
            'font-family': labelLang === 'zh' ? 'system-ui, -apple-system, sans-serif' : 'ui-monospace, SFMono-Regular, Menlo, monospace',
            class: 'node-text'
          }, gNode);
          txt.textContent = labelLang === 'zh' ? club.shortZh : code;

          gNode.addEventListener('mouseenter', (ev) => { hoveredTeam = code; updateHighlights(); showTooltip(ev, code, sIdx, seasons); });
          gNode.addEventListener('mousemove', (ev) => moveTooltip(ev));
          gNode.addEventListener('mouseleave', () => { hoveredTeam = null; updateHighlights(); hideTooltip(); });
          gNode.addEventListener('click', () => { h2hChartActive = false; togglePin(code); });
        });
      });

      // 7. Historic Milestones
      if (showMilestones) {
        seasons.forEach((s, sIdx) => {
          const x = xOf(sIdx);
          s.table.forEach((row, idx) => {
            const [code, pts] = row;
            const m = MILESTONE_MAP[`${s.id}_${code}`];
            if (!m) return;
            const rank = idx + 1;
            const y = yOfEntry(rank, pts);
            const dy = isPtsView ? m.dyPts : m.dyRank;
            const bx = x + (m.dx || 0);
            const by = y + dy;
            const tagText = uiLang === 'zh' ? m.tagZh : m.tagEn;

            const gMs = el('g', { class: 'milestone-group', 'data-team': code, 'data-sidx': sIdx }, milestonesLayer);
            el('line', { x1: x, y1: y + (dy < 0 ? -11 : 11), x2: bx, y2: by + (dy < 0 ? 8 : -8), stroke: '#F59E0B', 'stroke-width': 1.2, 'stroke-opacity': 0.85 }, gMs);

            const bw = Math.max(82, tagText.length * (uiLang === 'zh' ? 11 : 6.4) + 14);
            const bh = 18;
            el('rect', { x: bx - bw / 2, y: by - bh / 2, width: bw, height: bh, rx: 9, fill: light ? '#fffbeb' : '#1e1b13', stroke: '#F59E0B', 'stroke-width': 1.1 }, gMs);
            const mTxt = el('text', { x: bx, y: by + 3.5, 'text-anchor': 'middle', fill: light ? '#b45309' : '#fbbf24', 'font-size': '9.5', 'font-weight': '700' }, gMs);
            mTxt.textContent = tagText;

            gMs.addEventListener('mouseenter', (ev) => { hoveredTeam = code; updateHighlights(); showTooltip(ev, code, sIdx, seasons); });
            gMs.addEventListener('mousemove', (ev) => moveTooltip(ev));
            gMs.addEventListener('mouseleave', () => { hoveredTeam = null; updateHighlights(); hideTooltip(); });
            gMs.addEventListener('click', () => { h2hChartActive = false; togglePin(code); });
          });
        });
      }

      // 8. Right-side Latest Season Labels
      const lastSeason = seasons[numSeasons - 1];
      const rightX = xOf(numSeasons - 1) + 32;
      const rightItems = lastSeason.table.map((row, idx) => ({ code: row[0], pts: row[1], rank: idx + 1, y: yOfEntry(idx + 1, row[1]) }));
      if (isPtsView) {
        const minGap = 17;
        for (let i = 1; i < rightItems.length; i++) {
          if (rightItems[i].y - rightItems[i - 1].y < minGap) rightItems[i].y = rightItems[i - 1].y + minGap;
        }
      }

      rightItems.forEach(item => {
        const gLabel = el('g', { class: 'team-node right-label', 'data-team': item.code }, rightLabelsLayer);
        const lbl = el('text', { x: rightX, y: item.y + 4, fill: fg, 'font-size': '11.5', 'font-weight': item.rank <= 4 ? '700' : '500' }, gLabel);
        lbl.textContent = `${clubShort(item.code)} · ${item.pts}${tr.ptsUnit}`;

        gLabel.addEventListener('mouseenter', (ev) => { hoveredTeam = item.code; updateHighlights(); showTooltip(ev, item.code, numSeasons - 1, seasons); });
        gLabel.addEventListener('mousemove', (ev) => moveTooltip(ev));
        gLabel.addEventListener('mouseleave', () => { hoveredTeam = null; updateHighlights(); hideTooltip(); });
        gLabel.addEventListener('click', () => { h2hChartActive = false; togglePin(item.code); });
      });

      updateHighlights();
    }

    function updateHighlights() {
      const tr = t();
      const light = isLightTheme();
      const neutralFill = light ? '#cbd5e1' : '#334155';
      const neutralText = light ? '#334155' : '#cbd5e1';
      const mutedStroke = light ? '#94a3b8' : '#475569';
      const isPtsView = currentView === 'points';

      const anyFocus = h2hChartActive || Boolean(hoveredTeam) || pinnedTeams.size > 0;
      const svg = document.getElementById('bump-chart');

      svg.querySelectorAll('.team-path').forEach(path => {
        const code = path.dataset.team;
        const consecutive = path.dataset.consecutive === '1';
        const toLive = path.dataset.tolive === '1';
        const club = CLUBS[code];
        const emph = isTeamEmphasized(code);

        if (emph) {
          path.setAttribute('stroke', club.color);
          const strong = h2hChartActive || hoveredTeam === code || pinnedTeams.has(code);
          path.setAttribute('stroke-width', strong ? (consecutive ? 3.8 : 2.6) : (consecutive ? 2.8 : (toLive ? 2.2 : 1.5)));
          path.setAttribute('stroke-opacity', consecutive ? (anyFocus ? 0.98 : 0.85) : (toLive ? 0.82 : 0.55));
          if (path.parentNode && path.parentNode.parentNode) path.parentNode.parentNode.appendChild(path.parentNode);
        } else {
          path.setAttribute('stroke', mutedStroke);
          path.setAttribute('stroke-width', consecutive ? 1.1 : 0.85);
          path.setAttribute('stroke-opacity', anyFocus ? 0.06 : (isPtsView ? 0.12 : 0.16));
        }
      });

      svg.querySelectorAll('.team-node:not(.right-label)').forEach(g => {
        const code = g.dataset.team;
        const club = CLUBS[code];
        const emph = isTeamEmphasized(code);
        const rect = g.querySelector('.node-rect');
        const text = g.querySelector('.node-text');

        if (emph) {
          g.style.opacity = '1';
          rect.setAttribute('fill', club.color);
          text.setAttribute('fill', '#ffffff');
          if (g.parentNode) g.parentNode.appendChild(g);
        } else if (anyFocus) {
          g.style.opacity = isPtsView ? '0.12' : '0.18';
          rect.setAttribute('fill', neutralFill);
          text.setAttribute('fill', neutralText);
        } else {
          g.style.opacity = isPtsView ? '0.38' : '0.72';
          rect.setAttribute('fill', neutralFill);
          text.setAttribute('fill', neutralText);
        }
      });

      svg.querySelectorAll('.milestone-group').forEach(g => {
        const code = g.dataset.team;
        const emph = isTeamEmphasized(code);
        g.style.opacity = anyFocus ? (emph ? '1' : '0.14') : '0.96';
      });

      svg.querySelectorAll('.right-label').forEach(g => {
        const code = g.dataset.team;
        const emph = isTeamEmphasized(code);
        g.style.opacity = emph ? '1' : (anyFocus ? '0.18' : '0.68');
      });

      const statusEl = document.getElementById('active-status');
      if (h2hChartActive) {
        statusEl.textContent = tr.statusH2H(clubLabel(h2hTeamA), clubLabel(h2hTeamB));
      } else if (hoveredTeam) {
        statusEl.textContent = tr.statusPreview(CLUBS[hoveredTeam]);
      } else if (pinnedTeams.size > 0) {
        statusEl.textContent = tr.statusPinned([...pinnedTeams].map(c => clubLabel(c)).join(' · '));
      } else {
        statusEl.textContent = tr.modes[currentMode];
      }
    }

    // =========================================================================
    // Rich Tooltip
    // =========================================================================
    function showTooltip(ev, code, sIdx, seasons) {
      const tr = t();
      const tip = document.getElementById('tooltip');
      const club = CLUBS[code];
      const s = seasons[sIdx];
      const entryIdx = s.table.findIndex(r => r[0] === code);
      if (entryIdx === -1) return;

      const [, pts, mp, w, d, l, gf, ga, gd, form] = s.table[entryIdx];
      const rank = entryIdx + 1;
      const h = clubHistory[code];
      const milestone = MILESTONE_MAP[`${s.id}_${code}`];

      const fullIdx = SEASONS.findIndex(x => x.id === s.id);
      let deltaHtml = `<span class="text-[var(--muted-foreground)]">${tr.tipBase}</span>`;
      if (fullIdx > 0) {
        const prevSeason = SEASONS[fullIdx - 1];
        const prevPos = prevSeason.table.findIndex(r => r[0] === code);
        if (prevPos === -1) deltaHtml = `<span style="color:#10B981;font-weight:600">${tr.tipPromoted}</span>`;
        else {
          const diff = (prevPos + 1) - rank;
          if (diff > 0) deltaHtml = `<span style="color:#10B981;font-weight:600">${tr.tipUp(diff)}</span>`;
          else if (diff < 0) deltaHtml = `<span style="color:#EF4444;font-weight:600">${tr.tipDown(Math.abs(diff))}</span>`;
          else deltaHtml = `<span class="text-[var(--muted-foreground)]">${tr.tipSame}</span>`;
        }
      }

      let badge = '';
      if (s.live) badge = `<span class="px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-400 font-bold">${tr.badgeLive}</span>`;
      else if (rank === 1) badge = `<span class="px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-500 font-bold">${tr.badgeChamp}</span>`;
      else if (rank <= 4) badge = `<span class="px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-500 font-semibold">${tr.badgeUCL}</span>`;
      else if (rank >= 18) badge = `<span class="px-1.5 py-0.5 rounded bg-red-500/20 text-red-500 font-semibold">${tr.badgeRel}</span>`;

      const gfGaText = (gf !== null && ga !== null) ? `${gf} / ${ga}` : '—';
      const gdColor = gd > 0 ? '#10B981' : gd < 0 ? '#EF4444' : 'var(--muted-foreground)';

      const milestoneBlock = milestone ? `
        <div class="mt-2 px-2.5 py-1.5 rounded-lg bg-amber-500/12 border border-amber-500/35 text-[11px] leading-snug">
          <div class="font-bold text-amber-400 mb-0.5">${uiLang === 'zh' ? milestone.tagZh : milestone.tagEn}</div>
          <div class="text-[var(--foreground)]">${uiLang === 'zh' ? milestone.storyZh : milestone.storyEn}</div>
        </div>
      ` : '';

      const formBlock = form ? `
        <div class="flex items-center justify-between mt-2 pt-2 border-t border-[var(--border)]">
          <span class="text-[11px] text-[var(--muted-foreground)]">${tr.tipForm}</span>
          <div class="flex items-center gap-1.5">${renderFormDots(form)}</div>
        </div>
      ` : '';

      tip.innerHTML = `
        <div class="flex items-center justify-between gap-3 mb-2">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full shrink-0" style="background:${club.color}"></span>
            <div>
              <div class="font-bold text-sm text-[var(--foreground)] leading-tight">${clubLabel(code)}</div>
              <div class="text-[11px] text-[var(--muted-foreground)]">${uiLang === 'zh' ? club.name : club.zh}</div>
            </div>
          </div>
          ${badge}
        </div>
        <div class="grid grid-cols-4 gap-1.5 py-2 border-y border-[var(--border)] text-center">
          <div><div class="text-[10px] text-[var(--muted-foreground)]">${tr.tipSeason}</div><div class="font-mono font-bold">${s.id}</div></div>
          <div><div class="text-[10px] text-[var(--muted-foreground)]">${tr.tipRank}</div><div class="font-mono font-bold text-sm">#${rank}</div></div>
          <div><div class="text-[10px] text-[var(--muted-foreground)]">${tr.tipPts}</div><div class="font-mono font-bold text-sm">${pts}</div></div>
          <div><div class="text-[10px] text-[var(--muted-foreground)]">${tr.tipMP}</div><div class="font-mono font-bold">${mp}</div></div>
        </div>
        <div class="grid grid-cols-3 gap-1.5 pt-2 text-center">
          <div class="rounded-md bg-[var(--background)] py-1 px-1.5"><div class="text-[10px] text-[var(--muted-foreground)]">${tr.tipWDL}</div><div class="font-mono font-semibold text-[11px]">${w}-${d}-${l}</div></div>
          <div class="rounded-md bg-[var(--background)] py-1 px-1.5"><div class="text-[10px] text-[var(--muted-foreground)]">${tr.tipGFGA}</div><div class="font-mono font-semibold text-[11px]">${gfGaText}</div></div>
          <div class="rounded-md bg-[var(--background)] py-1 px-1.5"><div class="text-[10px] text-[var(--muted-foreground)]">${tr.tipGD}</div><div class="font-mono font-bold text-[11px]" style="color:${gdColor}">${fmtGD(gd)}</div></div>
        </div>
        ${milestoneBlock}
        ${formBlock}
        <div class="flex items-center justify-between mt-2 pt-1.5 border-t border-[var(--border)] text-[11px]">
          <span>${tr.tipDelta}${deltaHtml}</span>
          <span class="text-[var(--muted-foreground)]">${h.seasons.length ? tr.tipAvg(h.avgRank.toFixed(1)) : tr.tipNew}</span>
        </div>
      `;

      tip.classList.remove('hidden');
      moveTooltip(ev);
    }

    function moveTooltip(ev) {
      const tip = document.getElementById('tooltip');
      const pad = 16;
      const tw = tip.offsetWidth || 270;
      const th = tip.offsetHeight || 220;
      let left = ev.clientX + pad;
      let top = ev.clientY + pad;
      if (left + tw > window.innerWidth - 10) left = ev.clientX - tw - pad;
      if (top + th > window.innerHeight - 10) top = ev.clientY - th - pad;
      tip.style.left = `${Math.max(8, left)}px`;
      tip.style.top = `${Math.max(8, top)}px`;
    }

    function hideTooltip() { document.getElementById('tooltip').classList.add('hidden'); }

    // =========================================================================
    // STAGE 2: Tab 1 — Head-to-Head Rivalry PK
    // =========================================================================
    function renderH2HControls() {
      const tr = t();
      const sortedCodes = Object.values(clubHistory)
        .filter(h => h.seasons.length > 0)
        .sort((a, b) => b.totalPts - a.totalPts)
        .map(h => h.code);

      const selA = document.getElementById('h2h-team-a');
      const selB = document.getElementById('h2h-team-b');
      const buildOpts = (selected) => sortedCodes.map(c =>
        `<option value="${c}" ${c === selected ? 'selected' : ''}>${clubLabel(c)} (${c})</option>`
      ).join('');
      selA.innerHTML = buildOpts(h2hTeamA);
      selB.innerHTML = buildOpts(h2hTeamB);

      const focusBtn = document.getElementById('h2h-focus-btn');
      focusBtn.textContent = h2hChartActive ? tr.h2hFocusOff : tr.h2hFocusOn;
      if (h2hChartActive) {
        focusBtn.style.background = '#F59E0B';
        focusBtn.style.borderColor = '#F59E0B';
        focusBtn.style.color = '#0b1120';
      } else {
        focusBtn.style.background = 'var(--background)';
        focusBtn.style.borderColor = 'var(--border)';
        focusBtn.style.color = 'var(--foreground)';
      }

      const presetsEl = document.getElementById('h2h-presets');
      presetsEl.innerHTML = '';
      RIVALRY_PRESETS.forEach(([a, b]) => {
        const btn = document.createElement('button');
        const active = (h2hTeamA === a && h2hTeamB === b);
        btn.className = 'pill-btn px-2.5 py-1 rounded-full text-[11px] font-medium border';
        btn.style.background = active ? 'var(--primary)' : 'var(--background)';
        btn.style.borderColor = active ? 'var(--primary)' : 'var(--border)';
        btn.style.color = active ? 'var(--primary-foreground)' : 'var(--foreground)';
        btn.textContent = `${clubShort(a)} vs ${clubShort(b)}`;
        btn.addEventListener('click', () => {
          h2hTeamA = a; h2hTeamB = b;
          h2hChartActive = true;
          renderH2HControls();
          renderH2HDashboard();
          renderClubChips();
          updateControlButtons();
          renderChart();
        });
        presetsEl.appendChild(btn);
      });
    }

    function renderH2HDashboard() {
      const tr = t();
      const box = document.getElementById('h2h-dashboard');
      const cA = CLUBS[h2hTeamA], cB = CLUBS[h2hTeamB];
      const hA = clubHistory[h2hTeamA], hB = clubHistory[h2hTeamB];

      let winsA = 0, winsB = 0, shared = 0;
      const sharedList = [];
      COMPLETED_SEASONS.forEach(s => {
        const iA = s.table.findIndex(r => r[0] === h2hTeamA);
        const iB = s.table.findIndex(r => r[0] === h2hTeamB);
        if (iA !== -1 && iB !== -1) {
          shared++;
          if (iA < iB) winsA++;
          else if (iB < iA) winsB++;
          sharedList.push({ id: s.id, rA: iA + 1, rB: iB + 1, winner: iA < iB ? 'A' : 'B' });
        }
      });

      const pctA = shared > 0 ? Math.round((winsA / shared) * 100) : 50;
      const pctB = 100 - pctA;

      const metricRow = (label, valA, valB, lowerBetter = false) => {
        const aWin = lowerBetter ? valA < valB : valA > valB;
        const bWin = lowerBetter ? valB < valA : valB > valA;
        return `
          <div class="grid grid-cols-3 items-center py-2 border-b border-[var(--border)] last:border-b-0 text-xs">
            <div class="font-mono text-sm ${aWin ? 'font-bold' : 'text-[var(--muted-foreground)]'}" style="${aWin ? `color:${cA.color}` : ''}">${valA}</div>
            <div class="text-center text-[11px] text-[var(--muted-foreground)]">${label}</div>
            <div class="text-right font-mono text-sm ${bWin ? 'font-bold' : 'text-[var(--muted-foreground)]'}" style="${bWin ? `color:${cB.color}` : ''}">${valB}</div>
          </div>
        `;
      };

      box.innerHTML = `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
          <!-- Left: Scoreboard & Split Bar -->
          <div class="lg:col-span-5 rounded-xl border border-[var(--border)] bg-[var(--background)] p-4 flex flex-col justify-between gap-3">
            <div class="text-xs text-center text-[var(--muted-foreground)] font-medium">${tr.h2hShared(shared)}</div>
            <div class="flex items-center justify-between gap-3">
              <div class="text-left">
                <div class="flex items-center gap-2">
                  <span class="w-3 h-3 rounded-full" style="background:${cA.color}"></span>
                  <span class="font-bold text-base">${clubLabel(h2hTeamA)}</span>
                </div>
                <div class="font-mono text-3xl font-black mt-1" style="color:${cA.color}">${winsA}</div>
              </div>
              <div class="text-xs font-mono text-[var(--muted-foreground)]">VS</div>
              <div class="text-right">
                <div class="flex items-center justify-end gap-2">
                  <span class="font-bold text-base">${clubLabel(h2hTeamB)}</span>
                  <span class="w-3 h-3 rounded-full" style="background:${cB.color}"></span>
                </div>
                <div class="font-mono text-3xl font-black mt-1" style="color:${cB.color}">${winsB}</div>
              </div>
            </div>
            <div class="w-full h-3 rounded-full overflow-hidden flex bg-[var(--card)]">
              <div style="width:${pctA}%;background:${cA.color}" class="h-full transition-all duration-300"></div>
              <div style="width:${pctB}%;background:${cB.color}" class="h-full transition-all duration-300"></div>
            </div>
            <div class="flex flex-wrap gap-1 pt-1">
              ${sharedList.map(item => `
                <span title="${item.id}: ${clubShort(h2hTeamA)} #${item.rA} vs ${clubShort(h2hTeamB)} #${item.rB}"
                  class="px-1.5 py-0.5 rounded text-[10px] font-mono font-bold text-white"
                  style="background:${item.winner === 'A' ? cA.color : cB.color};opacity:0.9">${item.id}</span>
              `).join('')}
            </div>
          </div>

          <!-- Right: Detailed Stat Comparison -->
          <div class="lg:col-span-7 rounded-xl border border-[var(--border)] bg-[var(--background)] px-4 py-2">
            ${metricRow(tr.h2hPts, `${hA.totalPts} (${hA.totalPts - hB.totalPts >= 0 ? '+' : ''}${hA.totalPts - hB.totalPts})`, `${hB.totalPts} (${hB.totalPts - hA.totalPts >= 0 ? '+' : ''}${hB.totalPts - hA.totalPts})`)}
            ${metricRow(tr.h2hGD, fmtGD(hA.totalGD), fmtGD(hB.totalGD))}
            ${metricRow(tr.h2hTitles, hA.titles, hB.titles)}
            ${metricRow(tr.h2hTop4, hA.top4, hB.top4)}
            ${metricRow(tr.h2hAvg, '#' + hA.avgRank.toFixed(1), '#' + hB.avgRank.toFixed(1), true)}
          </div>
        </div>
      `;
    }

    // =========================================================================
    // STAGE 2: Tab 2 — 14-Season All-Time Table (2012–26)
    // =========================================================================
    function renderAllTimeTable() {
      const tr = t();
      const cols = [
        { key: 'rank', label: tr.cols.rank, sortable: false, align: 'text-center' },
        { key: 'club', label: tr.cols.club, sortable: false, align: 'text-left' },
        { key: 'seasons', label: tr.cols.seasons, sortable: true, align: 'text-right' },
        { key: 'totalPts', label: tr.cols.pts, sortable: true, align: 'text-right' },
        { key: 'ppg', label: tr.cols.ppg, sortable: true, align: 'text-right' },
        { key: 'totalW', label: tr.cols.w, sortable: true, align: 'text-right' },
        { key: 'totalGD', label: tr.cols.gd, sortable: true, align: 'text-right' },
        { key: 'titles', label: tr.cols.titles, sortable: true, align: 'text-right' },
        { key: 'top4', label: tr.cols.top4, sortable: true, align: 'text-right' },
        { key: 'avgRank', label: tr.cols.avgRank, sortable: true, align: 'text-right' },
        { key: 'relegations', label: tr.cols.rel, sortable: true, align: 'text-right' }
      ];

      const thead = document.getElementById('alltime-thead');
      thead.innerHTML = `<tr>${cols.map(c => {
        const arrow = c.sortable && allTimeSortKey === c.key ? (allTimeSortDir === 'desc' ? ' ▼' : ' ▲') : '';
        return `<th data-sort="${c.sortable ? c.key : ''}" class="px-3 py-2.5 font-semibold ${c.align} ${c.sortable ? 'sortable' : ''}">${c.label}${arrow}</th>`;
      }).join('')}</tr>`;

      thead.querySelectorAll('th[data-sort]').forEach(th => {
        const key = th.dataset.sort;
        if (!key) return;
        th.addEventListener('click', () => {
          if (allTimeSortKey === key) allTimeSortDir = allTimeSortDir === 'desc' ? 'asc' : 'desc';
          else {
            allTimeSortKey = key;
            allTimeSortDir = key === 'avgRank' ? 'asc' : 'desc';
          }
          renderAllTimeTable();
        });
      });

      const rows = Object.values(clubHistory)
        .filter(h => h.seasons.length > 0)
        .map(h => ({ ...h, seasonsCount: h.seasons.length }));

      const getVal = (r, key) => key === 'seasons' ? r.seasonsCount : r[key];
      rows.sort((a, b) => {
        const va = getVal(a, allTimeSortKey), vb = getVal(b, allTimeSortKey);
        return allTimeSortDir === 'desc' ? vb - va : va - vb;
      });

      const tbody = document.getElementById('alltime-tbody');
      tbody.innerHTML = rows.map((h, idx) => {
        const c = CLUBS[h.code];
        const isPinned = pinnedTeams.has(h.code);
        return `
          <tr data-rowclub="${h.code}" class="cursor-pointer transition-colors hover:bg-[var(--background)] ${isPinned ? 'bg-[var(--primary)]/10' : ''}">
            <td class="px-3 py-2 text-center font-mono text-[var(--muted-foreground)]">${idx + 1}</td>
            <td class="px-3 py-2 font-semibold">
              <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${c.color}"></span>
                <span>${clubLabel(h.code)}</span>
                <span class="text-[11px] font-mono text-[var(--muted-foreground)]">${h.code}</span>
              </div>
            </td>
            <td class="px-3 py-2 text-right font-mono">${h.seasonsCount}</td>
            <td class="px-3 py-2 text-right font-mono font-bold text-[var(--foreground)]">${h.totalPts}</td>
            <td class="px-3 py-2 text-right font-mono">${h.ppg.toFixed(2)}</td>
            <td class="px-3 py-2 text-right font-mono">${h.totalW}</td>
            <td class="px-3 py-2 text-right font-mono font-semibold" style="color:${h.totalGD >= 0 ? '#10B981' : '#EF4444'}">${fmtGD(h.totalGD)}</td>
            <td class="px-3 py-2 text-right font-mono ${h.titles > 0 ? 'font-bold text-amber-400' : 'text-[var(--muted-foreground)]'}">${h.titles > 0 ? '🏆 ' + h.titles : '0'}</td>
            <td class="px-3 py-2 text-right font-mono">${h.top4}</td>
            <td class="px-3 py-2 text-right font-mono">#${h.avgRank.toFixed(1)}</td>
            <td class="px-3 py-2 text-right font-mono ${h.relegations > 0 ? 'text-rose-400' : 'text-[var(--muted-foreground)]'}">${h.relegations}</td>
          </tr>
        `;
      }).join('');

      tbody.querySelectorAll('tr[data-rowclub]').forEach(row => {
        row.addEventListener('click', () => {
          const code = row.dataset.rowclub;
          h2hChartActive = false;
          togglePin(code);
          renderAllTimeTable();
          document.getElementById('chart-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      });
    }

    // =========================================================================
    // STAGE 2: Tab 3 — Biggest Movers Radar (Risers & Fallers)
    // =========================================================================
    function renderMoversRadar() {
      const tr = t();
      const renderList = (list, elId, isRiser) => {
        const container = document.getElementById(elId);
        container.innerHTML = '';
        list.forEach((m, idx) => {
          const c = CLUBS[m.code];
          const item = document.createElement('button');
          item.className = 'w-full text-left rounded-xl border border-[var(--border)] bg-[var(--card)] hover:border-[var(--primary)] p-2.5 flex items-center justify-between gap-3 transition-colors cursor-pointer';
          item.innerHTML = `
            <div class="flex items-center gap-2.5 min-w-0">
              <span class="font-mono text-xs text-[var(--muted-foreground)] w-4">${idx + 1}</span>
              <span class="w-3 h-3 rounded-full shrink-0" style="background:${c.color}"></span>
              <div class="truncate">
                <div class="font-bold text-xs sm:text-sm truncate">${clubLabel(m.code)} <span class="font-mono text-[11px] font-normal text-[var(--muted-foreground)]">(${m.fromSeason} → ${m.toSeason})</span></div>
                <div class="text-[11px] text-[var(--muted-foreground)] font-mono">#${m.fromRank} (${m.fromPts}p) → #${m.toRank} (${m.toPts}p)</div>
              </div>
            </div>
            <div class="shrink-0 text-right">
              <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-mono font-bold ${isRiser ? 'bg-emerald-500/15 text-emerald-400' : 'bg-rose-500/15 text-rose-400'}">
                ${isRiser ? '▲ +' + m.delta : '▼ ' + m.delta}
              </span>
              <div class="text-[10px] text-[var(--muted-foreground)] mt-0.5">${tr.clickLocate}</div>
            </div>
          `;
          item.addEventListener('click', () => {
            h2hChartActive = false;
            pinnedTeams = new Set([m.code]);
            renderClubChips();
            renderPinnedCards();
            updateControlButtons();
            renderChart();
            document.getElementById('chart-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
          });
          container.appendChild(item);
        });
      };

      renderList(TOP_RISERS, 'risers-list', true);
      renderList(TOP_FALLERS, 'fallers-list', false);
    }

    function switchAnalyticsTab(tab) {
      activeTab = tab;
      document.getElementById('tab-h2h').classList.toggle('hidden', tab !== 'h2h');
      document.getElementById('tab-alltime').classList.toggle('hidden', tab !== 'alltime');
      document.getElementById('tab-movers').classList.toggle('hidden', tab !== 'movers');
      updateControlButtons();
    }

    // =========================================================================
    // Event Wiring
    // =========================================================================
    document.querySelectorAll('.uilang-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const nextLang = btn.dataset.uilang;
        if (nextLang === uiLang) return;
        uiLang = nextLang;
        localStorage.setItem('pl_ui_lang', uiLang);
        if (uiLang === 'en') labelLang = 'en';
        applyStaticTranslations();
        updateControlButtons();
        renderClubChips();
        renderChampionsTimeline();
        renderPinnedCards();
        renderH2HControls();
        renderH2HDashboard();
        renderAllTimeTable();
        renderMoversRadar();
        renderChart();
      });
    });

    document.querySelectorAll('.view-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (currentView === btn.dataset.view) return;
        currentView = btn.dataset.view;
        updateControlButtons();
        renderChart();
      });
    });

    document.querySelectorAll('#mode-buttons button').forEach(btn => {
      btn.addEventListener('click', () => {
        currentMode = btn.dataset.mode;
        h2hChartActive = false;
        pinnedTeams.clear();
        updateControlButtons();
        renderClubChips();
        renderPinnedCards();
        renderH2HControls();
        renderChart();
      });
    });

    document.querySelectorAll('.range-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentRange = btn.dataset.range;
        updateControlButtons();
        renderChart();
      });
    });

    document.getElementById('toggle-milestones').addEventListener('click', () => {
      showMilestones = !showMilestones;
      updateControlButtons();
      renderChart();
    });

    document.getElementById('toggle-live').addEventListener('click', () => {
      if (currentView === 'points') return;
      includeLive = !includeLive;
      updateControlButtons();
      renderChart();
    });

    document.getElementById('toggle-lang').addEventListener('click', () => {
      labelLang = labelLang === 'en' ? 'zh' : 'en';
      updateControlButtons();
      renderChart();
    });

    document.getElementById('toggle-theme').addEventListener('click', () => {
      document.documentElement.classList.toggle('light');
      updateControlButtons();
      renderClubChips();
      renderChart();
    });

    document.getElementById('clear-pins').addEventListener('click', () => {
      pinnedTeams.clear();
      h2hChartActive = false;
      renderClubChips();
      renderPinnedCards();
      renderH2HControls();
      renderAllTimeTable();
      renderChart();
    });

    // Stage 2 Events
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => switchAnalyticsTab(btn.dataset.tab));
    });

    document.getElementById('h2h-team-a').addEventListener('change', (ev) => {
      h2hTeamA = ev.target.value;
      renderH2HControls();
      renderH2HDashboard();
      if (h2hChartActive) { renderClubChips(); renderChart(); }
    });

    document.getElementById('h2h-team-b').addEventListener('change', (ev) => {
      h2hTeamB = ev.target.value;
      renderH2HControls();
      renderH2HDashboard();
      if (h2hChartActive) { renderClubChips(); renderChart(); }
    });

    document.getElementById('h2h-focus-btn').addEventListener('click', () => {
      h2hChartActive = !h2hChartActive;
      renderH2HControls();
      renderClubChips();
      updateControlButtons();
      renderChart();
      if (h2hChartActive) {
        document.getElementById('chart-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });

    // Initial render
    applyStaticTranslations();
    updateControlButtons();
    renderClubChips();
    renderChampionsTimeline();
    renderH2HControls();
    renderH2HDashboard();
    renderAllTimeTable();
    renderMoversRadar();
    renderChart();
  </script>
</body>
</html>
